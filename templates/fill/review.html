{% extends "base.html" %}
{% block title %}检查并提交 · {{ survey.title }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>检查并提交</h1>
  <p class="muted">请确认以下回答；提交后不能修改。</p>
  <table class="review">
    <tbody>
      {% for row in rows %}
        <tr>
          <th>第 {{ row.question.order }} 题<br><span class="muted small">{{ row.question.title }}</span></th>
          <td>{{ row.display }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
  <form method="post" action="{{ url_for('fill.submit', public_id=survey.public_id) }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <div class="row">
      <button type="submit" class="btn primary">确认提交</button>
      <a class="btn" href="{{ url_for('fill.intro', public_id=survey.public_id) }}">返回</a>
    </div>
  </form>
  <form method="post" action="{{ url_for('fill.abandon', public_id=survey.public_id) }}" class="inline" onsubmit="return confirm('放弃后本次已填内容会被删除，确定吗？');">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <button type="submit" class="btn link-button danger">放弃本次填写</button>
  </form>
</section>
{% endblock %}
